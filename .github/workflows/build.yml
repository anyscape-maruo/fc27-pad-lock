name: Windows build and policy checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        shell: powershell
        run: ./build/build.ps1
      - name: Verify without hooks or game input
        shell: powershell
        run: ./scripts/verify.ps1
      - name: Create distribution
        shell: powershell
        run: ./scripts/package.ps1
      - name: Build and verify integrated installer
        shell: powershell
        run: |
          $zip = (Get-ChildItem artifacts/FC27PadLock-*-win-x64.zip).FullName
          $setup = Join-Path $pwd 'artifacts/FC27PadLockSetup.exe'
          ./scripts/build-setup.ps1 -PayloadZip $zip -OutputPath $setup
          $report = Join-Path $pwd 'build/setup-self-test.json'
          $test = Start-Process $setup -ArgumentList @('--self-test',('"{0}"' -f $report)) -PassThru -WindowStyle Hidden
          if (-not $test.WaitForExit(15000) -or $test.ExitCode -ne 0) { throw 'Installer self-test failed.' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.failures -ne 0 -or $result.installPerformed -ne $false) { throw 'Installer verification failed.' }
          "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant())  FC27PadLockSetup.exe" | Add-Content artifacts/SHA256SUMS.txt -Encoding ASCII
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-preview
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
            build/verification-summary.json
          if-no-files-found: error
